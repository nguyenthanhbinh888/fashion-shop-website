server:
  port: 8080

spring:
  application:
    name: clothingstore
  datasource:
    url: jdbc:mysql://localhost:3306/clothing_store?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: 9a4f2c8d3b7a1e6f4c8b2d0e1f3a5b7c9e0d2f4a6b8c1d3e5f7a9b0c2d4e6f8a
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
  payment:
    vnpay:
      tmn-code: "DEMO_LUXE"
      hash-secret: "SANDBOX_SECRET_HASH_DEMO_2026"
      pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      return-url: "http://localhost:5173/checkout/payment-result"
